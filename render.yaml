services:
  - type: web
    name: restaurant-reservation-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=backend python backend/migrate.py && PYTHONPATH=backend uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-reservation-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://restaurant-reservation-frontend-jjo6.onrender.com

  - type: web
    name: restaurant-reservation-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://restaurant-reservation-api-6djs.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: restaurant-reservation-db
    plan: free
    region: oregon
